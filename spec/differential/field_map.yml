# Statistics reference: analysis_spec disables only tshark's SAP NI dissector
# for analysis-stats.pcap. Its opaque TCP payloads use source port 40000, which
# SAP NI also registers (packet-sapni.c, SAP_PROTOCOL_PORT_RANGE). Redhound has
# no SAP NI dissector and reports Data. This aligns the controlled fixture's
# interpretation without removing hierarchy rows, protocol counts or bytes.
# All named supported protocols and Data rows remain checked in full.
# Source: https://github.com/wireshark/wireshark/blob/wireshark-4.2.0/epan/dissectors/packet-sapni.c
# Option: https://www.wireshark.org/docs/man-pages/tshark.html
- {name: eth.src, normalize: string}
- {name: eth.dst, normalize: string}
- {name: eth.type, normalize: hex}
- {name: ip.src, normalize: string}
- {name: ip.dst, normalize: string}
- {name: ip.ttl, normalize: int}
- {name: ip.proto, normalize: int}
- {name: udp.srcport, normalize: int}
- {name: udp.dstport, normalize: int}
- {name: udp.length, normalize: int}
- {name: tcp.srcport, normalize: int}
- {name: tcp.dstport, normalize: int}
- {name: tcp.seq, reference: tcp.seq_raw, normalize: int}
- {name: tcp.ack, reference: tcp.ack_raw, normalize: int}
- {name: tcp.hdr_len, normalize: int}
- {name: tcp.flags, normalize: hex}
- {name: dns.id, normalize: hex}
- {name: dns.flags.response, normalize: bool}
- {name: dns.flags.opcode, normalize: int}
- {name: dns.flags.rcode, normalize: int}
- {name: dns.count.queries, normalize: int}
- {name: dns.count.answers, normalize: int}
- {name: dns.qry.name, normalize: string}
- {name: dns.qry.type, normalize: int}
- {name: dns.qry.class, normalize: hex}
- {name: dns.resp.name, normalize: string}
- {name: dns.resp.type, normalize: int}
- {name: dns.resp.ttl, normalize: int}
- {name: dns.a, normalize: string}
- {name: dns.aaaa, normalize: string}
- {name: dns.cname, normalize: string}
- {name: dns.mx.preference, normalize: int}
- {name: dns.mx.mail_exchange, normalize: string}
- {name: dns.txt, normalize: string}
- {name: dns.soa.serial_number, normalize: int}
- {name: dns.srv.port, normalize: int}
- {name: dns.svcb.svcpriority, normalize: int}
- {name: dns.svcb.targetname, normalize: string}
- {name: dns.svcb.svcparam.alpn, normalize: string}
- {name: dns.svcb.svcparam.port, normalize: int}
- {name: dns.rr.udp_payload_size, normalize: int}
- {name: dns.resp.z.do, normalize: bool}
- {name: dhcp.type, normalize: int}
- {name: dhcp.id, normalize: hex}
- {name: dhcp.hw.mac_addr, normalize: string}
- {name: dhcp.ip.your, normalize: string}
- {name: dhcp.option.dhcp, normalize: int}
- {name: dhcp.option.hostname, normalize: string}
- {name: ntp.flags.li, normalize: int}
- {name: ntp.flags.vn, normalize: int}
- {name: ntp.flags.mode, normalize: int}
- {name: ntp.stratum, normalize: int}
- {name: ntp.precision, normalize: int}
# NTP's API preserves the unsigned 32.32 wire timestamp; tshark renders UTC.
# The controlled fixture lies in NTP era 0 and normalization truncates to ns.
- {name: ntp.xmt, normalize: ntp_timestamp}
- {name: http.request.method, normalize: string}
- {name: http.request.uri, normalize: string}
- {name: http.request.version, normalize: string}
- {name: http.host, normalize: string}
- {name: http.content_length, normalize: int}
- {name: http.response.code, normalize: int}
- {name: tls.record.content_type, normalize: int}
- {name: tls.record.version, normalize: hex}
- {name: tls.record.length, normalize: int}
- {name: tls.handshake.type, normalize: int}
- {name: tls.handshake.length, normalize: int}
- {name: tls.handshake.version, normalize: hex}
- {name: tls.handshake.ciphersuite, normalize: hex}
- {name: tls.handshake.extensions_server_name, normalize: string}
- {name: tls.handshake.extensions_alpn_str, normalize: string}
- {name: tls.handshake.extensions.supported_version, normalize: hex}
