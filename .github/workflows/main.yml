name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.3'
          - '3.4'
          - '4.0'
          - head
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install RBS collection
        run: bundle exec rbs collection install --frozen
      - name: Run the default task (spec, rbs-inline, steep)
        run: bundle exec rake
      - name: Check generated RBS is committed
        run: git diff --exit-code sig/

  live:
    runs-on: ubuntu-latest
    name: Live capture (sudo)
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Run live specs as root
        run: sudo -E env "PATH=$PATH" REDHOUND_LIVE=1 bundle exec rspec --tag live
